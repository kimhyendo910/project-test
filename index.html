
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>로또 번호 자동 생성기</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 30px 16px;
      font-family: Arial, "Malgun Gothic", sans-serif;
      background: linear-gradient(135deg, #e8f0ff, #f8f9ff);
      color: #222;
    }

    .container {
      max-width: 620px;
      margin: 0 auto;
      padding: 28px 20px;
      background: white;
      border-radius: 24px;
      box-shadow: 0 10px 35px #243b631a;
      text-align: center;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 27px;
      color: #2348a0;
    }

    .subtitle {
      margin-bottom: 28px;
      color: #777;
      font-size: 14px;
    }

    .lotto-row {
      display: flex;
      align-items: center;
      gap: 7px;
      margin: 14px 0;
      padding: 15px 10px;
      border: 1px solid #edf0f5;
      border-radius: 14px;
      background: #fcfcff;
    }

    .game-label {
      min-width: 32px;
      font-size: 13px;
      font-weight: bold;
      color: #555;
    }

    .balls {
      display: flex;
      justify-content: center;
      flex: 1;
      flex-wrap: wrap;
      gap: 6px;
    }

    .ball {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      color: white;
      font-size: 15px;
      font-weight: bold;
      box-shadow: inset 0 -2px 3px #00000018;
    }

    .yellow { background: #f5b900; }
    .blue   { background: #3988df; }
    .red    { background: #ed6258; }
    .gray   { background: #888f9c; }
    .green  { background: #29a879; }

    .buttons {
      display: flex;
      gap: 10px;
      margin-top: 25px;
    }

    button {
      flex: 1;
      padding: 15px 10px;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.15s, opacity 0.15s;
    }

    button:active {
      transform: scale(0.97);
    }

    .generate {
      color: white;
      background: #3159c9;
    }

    .copy {
      color: #3159c9;
      background: #eaf0ff;
    }

    .notice {
      margin-top: 22px;
      font-size: 12px;
      line-height: 1.7;
      color: #999;
    }

    @media (max-width: 420px) {
      .container {
        padding: 24px 12px;
      }

      .lotto-row {
        gap: 4px;
        padding: 12px 5px;
      }

      .ball {
        width: 33px;
        height: 33px;
        font-size: 13px;
      }

      .balls {
        gap: 4px;
      }

      h1 {
        font-size: 23px;
      }
    }
  </style>
</head>
<body>

  <main class="container">
    <h1>🎱 로또 번호 자동 생성기</h1>
    <p class="subtitle">행운의 번호 5게임을 자동으로 뽑아보세요!</p>

    <div id="results"></div>

    <div class="buttons">
      <button class="generate" onclick="generateLotto()">
        🔄 번호 다시 생성
      </button>
      <button class="copy" onclick="copyLotto()">
        📋 번호 복사
      </button>
    </div>

    <p class="notice">
      각 게임은 1~45 중 중복 없이 6개 번호로 구성됩니다.<br>
      번호는 무작위로 생성되며 당첨을 보장하지 않습니다.
    </p>
  </main>

  <script>
    let lottoGames = [];

    function generateLotto() {
      lottoGames = [];

      for (let i = 0; i < 5; i++) {
        const numbers = [];

        while (numbers.length < 6) {
          const number = Math.floor(Math.random() * 45) + 1;

          if (!numbers.includes(number)) {
            numbers.push(number);
          }
        }

        numbers.sort((a, b) => a - b);
        lottoGames.push(numbers);
      }

      renderLotto();
    }

    function getColor(number) {
      if (number <= 10) return "yellow";
      if (number <= 20) return "blue";
      if (number <= 30) return "red";
      if (number <= 40) return "gray";
      return "green";
    }

    function renderLotto() {
      const results = document.getElementById("results");
      results.innerHTML = "";

      lottoGames.forEach((numbers, index) => {
        const row = document.createElement("div");
        row.className = "lotto-row";

        const label = document.createElement("div");
        label.className = "game-label";
        label.textContent = (index + 1) + "게임";

        const balls = document.createElement("div");
        balls.className = "balls";

        numbers.forEach(number => {
          const ball = document.createElement("span");
          ball.className = "ball " + getColor(number);
          ball.textContent = number;
          balls.appendChild(ball);
        });

        row.appendChild(label);
        row.appendChild(balls);
        results.appendChild(row);
      });
    }

    async function copyLotto() {
      const text = lottoGames.map((numbers, index) =>
        `${index + 1}게임: ${numbers.join(", ")}`
      ).join("\n");

      try {
        await navigator.clipboard.writeText(text);
        alert("로또 번호 5게임을 복사했습니다!");
      } catch (error) {
        const textarea = document.createElement("textarea");
        textarea.value = text;
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand("copy");
        textarea.remove();
        alert("로또 번호를 복사했습니다!");
      }
    }

    // 페이지를 열면 번호 5게임 자동 생성
    generateLotto();
  </script>

</body>
</html>
